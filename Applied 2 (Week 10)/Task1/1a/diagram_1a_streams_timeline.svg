<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="560" viewBox="0 0 1280 560" font-family="Helvetica, Arial, sans-serif">
<rect width="1280" height="560" fill="#fff"/>
<text x="640.0" y="34" text-anchor="middle" font-size="24" font-weight="bold">Hiding PCIe transfers: one stream vs. pinned memory + 3 CUDA streams</text>
<text x="640.0" y="58" text-anchor="middle" font-size="14" fill="#555">Illustrative: 3 × 8K RGB images (~100 MB each), PCIe 4.0 at ~25 GB/s achieved → ~4 ms per copy, ~0.4 ms per rotation kernel</text>
<text x="20" y="100" font-size="17" font-weight="bold">A) Synchronous: cudaMemcpy → kernel → cudaMemcpy, one image at a time</text>
<text x="236" y="134" text-anchor="end" font-size="15" font-weight="bold">Default stream</text>
<text x="236" y="150" text-anchor="end" font-size="12" fill="#555">copy, compute, copy</text>
<line x1="250" y1="158" x2="1260" y2="158" stroke="#ddd"/>
<rect x="250.0" y="118" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="330.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img1</text>
<rect x="410.0" y="118" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="426.0" y="118" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="506.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img1</text>
<rect x="586.0" y="118" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="666.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img2</text>
<rect x="746.0" y="118" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="762.0" y="118" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="842.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img2</text>
<rect x="922.0" y="118" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="1002.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img3</text>
<rect x="1082.0" y="118" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="1098.0" y="118" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="1178.0" y="140" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img3</text>
<text x="1258.0" y="178" text-anchor="end" font-size="14" font-weight="bold" fill="#c62828">total ≈ 25.2 ms</text>
<text x="20" y="232" font-size="17" font-weight="bold">B) Pinned host buffers + cudaMemcpyAsync on 3 streams (image i → stream i)</text>
<text x="236" y="266" text-anchor="end" font-size="15" font-weight="bold">Copy engine 1</text>
<text x="236" y="282" text-anchor="end" font-size="12" fill="#555">H2D (stream i)</text>
<line x1="250" y1="290" x2="1260" y2="290" stroke="#ddd"/>
<text x="236" y="316" text-anchor="end" font-size="15" font-weight="bold">SMs</text>
<text x="236" y="332" text-anchor="end" font-size="12" fill="#555">rotation kernel</text>
<line x1="250" y1="340" x2="1260" y2="340" stroke="#ddd"/>
<text x="236" y="366" text-anchor="end" font-size="15" font-weight="bold">Copy engine 2</text>
<text x="236" y="382" text-anchor="end" font-size="12" fill="#555">D2H (stream i)</text>
<line x1="250" y1="390" x2="1260" y2="390" stroke="#ddd"/>
<rect x="250.0" y="250" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="330.0" y="272" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img1</text>
<rect x="410.0" y="300" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="426.0" y="350" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="506.0" y="372" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img1</text>
<rect x="410.0" y="250" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="490.0" y="272" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img2</text>
<rect x="570.0" y="300" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="586.0" y="350" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="666.0" y="372" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img2</text>
<rect x="570.0" y="250" width="160.0" height="34" rx="4" fill="#1f5fbf" stroke="#fff" stroke-width="1.5"/>
<text x="650.0" y="272" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">H2D img3</text>
<rect x="730.0" y="300" width="16.0" height="34" rx="4" fill="#2e7d32" stroke="#fff" stroke-width="1.5"/>
<rect x="746.0" y="350" width="160.0" height="34" rx="4" fill="#d9730d" stroke="#fff" stroke-width="1.5"/>
<text x="826.0" y="372" text-anchor="middle" font-size="13" fill="#fff" font-weight="bold">D2H img3</text>
<text x="914.0" y="372" font-size="14" font-weight="bold" fill="#2e7d32">total ≈ 16.4 ms</text>
<line x1="250" y1="420" x2="1270.0" y2="420" stroke="#333" stroke-width="1.5"/>
<line x1="250" y1="420" x2="250" y2="426" stroke="#333"/>
<text x="250" y="442" text-anchor="middle" font-size="12">0</text>
<line x1="330" y1="420" x2="330" y2="426" stroke="#333"/>
<text x="330" y="442" text-anchor="middle" font-size="12">2</text>
<line x1="410" y1="420" x2="410" y2="426" stroke="#333"/>
<text x="410" y="442" text-anchor="middle" font-size="12">4</text>
<line x1="490" y1="420" x2="490" y2="426" stroke="#333"/>
<text x="490" y="442" text-anchor="middle" font-size="12">6</text>
<line x1="570" y1="420" x2="570" y2="426" stroke="#333"/>
<text x="570" y="442" text-anchor="middle" font-size="12">8</text>
<line x1="650" y1="420" x2="650" y2="426" stroke="#333"/>
<text x="650" y="442" text-anchor="middle" font-size="12">10</text>
<line x1="730" y1="420" x2="730" y2="426" stroke="#333"/>
<text x="730" y="442" text-anchor="middle" font-size="12">12</text>
<line x1="810" y1="420" x2="810" y2="426" stroke="#333"/>
<text x="810" y="442" text-anchor="middle" font-size="12">14</text>
<line x1="890" y1="420" x2="890" y2="426" stroke="#333"/>
<text x="890" y="442" text-anchor="middle" font-size="12">16</text>
<line x1="970" y1="420" x2="970" y2="426" stroke="#333"/>
<text x="970" y="442" text-anchor="middle" font-size="12">18</text>
<line x1="1050" y1="420" x2="1050" y2="426" stroke="#333"/>
<text x="1050" y="442" text-anchor="middle" font-size="12">20</text>
<line x1="1130" y1="420" x2="1130" y2="426" stroke="#333"/>
<text x="1130" y="442" text-anchor="middle" font-size="12">22</text>
<line x1="1210" y1="420" x2="1210" y2="426" stroke="#333"/>
<text x="1210" y="442" text-anchor="middle" font-size="12">24</text>
<line x1="1290" y1="420" x2="1290" y2="426" stroke="#333"/>
<text x="1290" y="442" text-anchor="middle" font-size="12">26</text>
<text x="236" y="442" text-anchor="end" font-size="13">time (ms)</text>
<text x="20" y="478" font-size="14">• Overlap needs page-locked (pinned) host memory, cudaMemcpyAsync, and non-default streams; GPUs with 2 copy engines can upload and download at the same time (PCIe is full duplex).</text>
<text x="20" y="504" font-size="14">• Steady state: one image finishes every ~4 ms instead of every ~8.4 ms (≈2× throughput), but the PCIe link is still the bottleneck: the kernel keeps the SMs busy only ~10% of the time.</text>
<text x="20" y="530" font-size="14">• So for rotation the transfer, not the arithmetic, sets the speed-up: keep images on the GPU across steps (decode → rotate → encode) to avoid paying PCIe twice per step.</text>
</svg>
