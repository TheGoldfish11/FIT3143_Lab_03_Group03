<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="Thread 0 runs one loop that never blocks; a congestion incident is spread over several passes of that loop and ends in a redirect to a neighbour or one report to the base station.">
<defs><marker id="ah-ink" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2430"/></marker><marker id="ah-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#3563a8"/></marker><marker id="ah-amber" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b4600e"/></marker><marker id="ah-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f7d4a"/></marker><marker id="ah-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/></marker><marker id="ah-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="11" markerHeight="11" markerUnits="userSpaceOnUse" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#7d8597"/></marker></defs>
<rect width="1280" height="720" fill="#ffffff"/>
<rect x="24" y="24" width="560" height="672" rx="14" fill="#f6f9fd" stroke="#c9ced8" stroke-width="1.5"/>
<text x="48" y="60" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1f2430">Main loop of thread 0 (repeats until FINAL)</text>
<rect x="100" y="90" width="450" height="96" rx="10" fill="#ffffff" stroke="#3563a8" stroke-width="2"/>
<circle cx="138" cy="138" r="18" fill="#3563a8"/>
<text x="138" y="144" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">1</text>
<text x="172" y="132" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1f2430">Handle every message that arrived</text>
<text x="172" y="158" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">MPI_Iprobe → MPI_Recv, reply via MPI_Isend</text>
<polyline points="325,186 325,218" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<rect x="100" y="220" width="450" height="96" rx="10" fill="#ffffff" stroke="#3563a8" stroke-width="2"/>
<circle cx="138" cy="268" r="18" fill="#3563a8"/>
<text x="138" y="274" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">2</text>
<text x="172" y="262" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1f2430">Every cycle (-c ms): count free ports</text>
<text x="172" y="288" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">save (time, free) to history[]</text>
<polyline points="325,316 325,348" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<rect x="100" y="350" width="450" height="96" rx="10" fill="#ffffff" stroke="#3563a8" stroke-width="2"/>
<circle cx="138" cy="398" r="18" fill="#3563a8"/>
<text x="138" y="404" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">3</text>
<text x="172" y="392" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1f2430">free ≤ threshold, no round open?</text>
<text x="172" y="418" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">yes → start a round (right)</text>
<polyline points="325,446 325,478" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<rect x="100" y="480" width="450" height="96" rx="10" fill="#ffffff" stroke="#3563a8" stroke-width="2"/>
<circle cx="138" cy="528" r="18" fill="#3563a8"/>
<text x="138" y="534" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#ffffff">4</text>
<text x="172" y="522" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="start" fill="#1f2430">Nothing handled? Sleep, then repeat</text>
<text x="172" y="548" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">sleep_us(-i), default 1000 µs</text>
<polyline points="325,576 325,616 60,616 60,138 98,138" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<text x="192" y="640" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5d6577">repeat</text>
<text x="48" y="676" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">Grey tags on the right name the loop step that does that work.</text>
<rect x="608" y="24" width="648" height="672" rx="14" fill="#ffffff" stroke="#c9ced8" stroke-width="1.5"/>
<text x="632" y="60" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1f2430">One congestion incident (spans several passes)</text>
<rect x="712" y="84" width="440" height="72" rx="10" fill="#fdeaea" stroke="#c0392b" stroke-width="2"/>
<text x="932.0" y="116.1" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">Free ports ≤ threshold</text>
<text x="932.0" y="136.0" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5d6577">e.g. 0 of 6 free, threshold = 1</text>
<polyline points="932,156 932,184" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<rect x="712" y="186" width="440" height="72" rx="10" fill="#eaf1fb" stroke="#3563a8" stroke-width="2"/>
<text x="932.0" y="218.1" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">NBR_REQ to each neighbour (2–4)</text>
<text x="932.0" y="238.0" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5d6577">MPI_Isend, then keep looping</text>
<rect x="1160.0" y="211.0" width="89.9" height="22" rx="11.0" fill="#f2f3f6" stroke="#c9ced8" stroke-width="1.5"/>
<text x="1205" y="226.3" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5d6577">loop step 3</text>
<polyline points="932,258 932,304" fill="none" stroke="#3563a8" stroke-width="2" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#ah-blue)"/>
<text x="946" y="287" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#3563a8">NBR_RESP replies arrive</text>
<rect x="627.0" y="319.0" width="89.9" height="22" rx="11.0" fill="#f2f3f6" stroke="#c9ced8" stroke-width="1.5"/>
<text x="672" y="334.3" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5d6577">loop step 1</text>
<polygon points="932,306.0 1142.0,370 932,434.0 722.0,370" fill="#ffffff" stroke="#1f2430" stroke-width="2"/>
<text x="932" y="364.4" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2430">All replies in.</text>
<text x="932" y="386.0" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#1f2430">Any neighbour above threshold?</text>
<polyline points="722,370 680,370 680,468" fill="none" stroke="#2f7d4a" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-green)"/>
<text x="700" y="360" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#2f7d4a">yes</text>
<polyline points="1142,370 1190,370 1190,468" fill="none" stroke="#b4600e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<text x="1166" y="360" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="700" text-anchor="middle" fill="#b4600e">no</text>
<rect x="624" y="470" width="272" height="112" rx="10" fill="#e4f3e9" stroke="#2f7d4a" stroke-width="2"/>
<text x="760.0" y="503.8" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">Redirect EVs</text>
<text x="760.0" y="523.8" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f2430">to the neighbour with</text>
<text x="760.0" y="542.7" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f2430">the most free ports</text>
<text x="760.0" y="560.6" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5d6577">no base station message</text>
<rect x="960" y="470" width="276" height="100" rx="10" fill="#fff1e0" stroke="#b4600e" stroke-width="2"/>
<text x="1098.0" y="516.1" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="17" font-weight="700" text-anchor="middle" fill="#1f2430">Send one REPORT</text>
<text x="1098.0" y="536.0" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5d6577">to the base station (104 B)</text>
<polyline points="1098,570 1098,598" fill="none" stroke="#b4600e" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-amber)"/>
<rect x="960" y="600" width="276" height="80" rx="10" fill="#fff1e0" stroke="#b4600e" stroke-width="2"/>
<text x="1098.0" y="635.7" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#1f2430">BASE_REPLY arrives</text>
<text x="1098.0" y="655.3" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#1f2430">forward nearest nodes to EVs</text>
<rect x="859.0" y="629.0" width="89.9" height="22" rx="11.0" fill="#f2f3f6" stroke="#c9ced8" stroke-width="1.5"/>
<text x="904" y="644.3" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="12" font-weight="400" text-anchor="middle" fill="#5d6577">loop step 1</text>
</svg>
