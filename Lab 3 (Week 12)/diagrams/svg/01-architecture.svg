<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="1280" height="720" role="img" aria-label="A 3 by 3 Cartesian grid of charging node processes, each linked only to its neighbours, plus one base station process that every node reaches directly.">
