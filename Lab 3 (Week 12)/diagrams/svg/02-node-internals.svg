<text x="785" y="342" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="400" text-anchor="middle" fill="#5d6577">in use</text>
<rect x="48" y="296" width="804" height="56" rx="0" fill="none" stroke="#1f2430" stroke-width="2.5"/>
<text x="48" y="380" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="16" font-weight="700" text-anchor="start" fill="#1f2430">port_in_use[k]</text>
<text x="196" y="380" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#5d6577">shared by all k + 1 threads of this node</text>
<polyline points="651,354 651,428" fill="none" stroke="#1f2430" stroke-width="2" stroke-linejoin="round" marker-end="url(#ah-ink)"/>
<text x="638" y="408" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="end" fill="#1f2430">atomic read of every slot → free ports</text>
<rect x="372" y="430" width="480" height="240" rx="10" fill="#d9e5f7" stroke="#3563a8" stroke-width="2.5"/>
<text x="392" y="462" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="18" font-weight="700" text-anchor="start" fill="#1f2430">thread 0: control thread</text>
<text x="392" y="486" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="13" font-weight="400" text-anchor="start" fill="#5d6577">the only thread that calls MPI (MPI_THREAD_FUNNELED)</text>
<text x="392" y="522" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• each cycle: count free ports, save to history</text>
<text x="392" y="548" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• free ≤ threshold → NBR_REQ to every neighbour</text>
<text x="392" y="574" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• all neighbours full → one REPORT to base station</text>
<text x="392" y="600" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• receives with MPI_Iprobe + MPI_Recv, never waits</text>
<text x="392" y="626" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• sends with MPI_Isend from a buffer pool</text>
<text x="392" y="652" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="15" font-weight="400" text-anchor="start" fill="#1f2430">• on FINAL: stops the port threads</text>
<rect x="48" y="430" width="280" height="240" rx="10" fill="#f2f3f6" stroke="#7d8597" stroke-width="2"/>
<text x="68" y="462" font-family="'JetBrains Mono', 'DejaVu Sans Mono', monospace" font-size="17" font-weight="700" text-anchor="start" fill="#1f2430">history[256]</text>
<text x="68" y="486" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="14" font-weight="400" text-anchor="start" fill="#5d6577">ring buffer, like Table 1</text>
<text x="68" y="522" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="start" fill="#5d6577">time</text>
<text x="300" y="522" font-family="'Public Sans', 'Liberation Sans', Arial, sans-serif" font-size="13" font-weight="700" text-anchor="end" fill="#5d6577">free ports</text>
